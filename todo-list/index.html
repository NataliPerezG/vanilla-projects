<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./public/todo-list-icon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script defer type="module" src="/src/main.js"></script>
  <title>todo-list</title>
</head>

<body>

  <main class="container">
    <h1>TolDo List App</h1>

    <header class="status">
      <div class="status__progress">
        <h2 class="status__message">Mantente enfocado!</h2>
        <div class="status__progress-bar">
          <div class="status__progress-fill"></div>
        </div>
      </div>
      <section class="status__info">
        <h2 class="status__info-number">
          <span class="status__completed-tasks">3</span> /
          <span class="status__total-tasks">5</span>
        </h2>
      </section>
    </header>

    <form class="form">
      <input class="form__user-task" type="text">
      <button class="form__btn-add" type="submit"> Agregar</button>
    </form>

    <section class="tasks">
      <article class="task">
        <div class="task__message">
          <button type="button" class="task__btn-completed">Tarea completa</button>
          <p class="task__text">Tarea 1</p>
        </div>
        <div class="task__actions">
          <button type="button" class="task__btn-edit">Editar</button>
          <button type="button" class="task__btn-delete">Borrar</button>
        </div>
      </article>
    </section>

  </main>

</body>

</html>

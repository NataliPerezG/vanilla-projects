<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script type="module" defer src="/src/main.js"></script>
  <title> Kanban - Tom</title>
</head>

<body>
  <main class="container">
    <form class="form">
      <input type="text" autofocus>
      <button type="submit">Add +</button>
    </form>

    <section class="lines">
      <article class="line line-todo">
        <h2 class="line-title">Para Hacer</h2>
        <p class="task" draggable="true">Tarea Uno</p>
        <p class="task" draggable="true">Tarea Tres</p>
      </article>

      <article class="line line-progress">
        <h2 class="line-title">En Progreso</h2>
        <p class="task" draggable="true">Tarea Cuatro</p>
        <p class="task" draggable="true">Tarea Cinco</p>

      </article>
      <article class="line line-completed">
        <h2 class="line-title">Completada</h2>
        <p class="task" draggable="true">Tarea Dos</p>
      </article>
    </section>
  </main>


</body>

</html>

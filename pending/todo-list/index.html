<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./public/todo-list-icon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script defer type="module" src="/src/main.js"></script>
  <title>todo-list</title>
</head>

<body>

  <main>
    <form>
      <input type="text" class="userInput" placeholder="Nueva Tarea">
      <button class="addTask">Crear</button>
    </form>
    <ul class="containerTasks">
    </ul>
  </main>

  <template class="templateTask">
    <li class="task" data-task-id="0">
      <input type="checkbox" name="check" class="check">
      <p class="taskText">Tarea desde html</p>
      <div class="buttonsTask">
        <button class="editTask">Editar</button>
        <button class="deleteTask">Borrar</button>
      </div>
    </li>
  </template>
</body>

</body>

</html>

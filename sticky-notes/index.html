<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/bloc-ico.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&family=Englebert&display=swap"
    rel="stylesheet">
  <script defer type="module" src="/src/main.js"></script>
  <title>sticky-notes</title>
</head>

<body>

  <!--
  La aplicación se divide en dos áreas principales:
  - Sidebar: acciones, filtros y configuración.
  - Workspace: espacio libre donde el usuario organiza las notas.
-->
  <aside class="sidebar">

    <header class="sidebar__header">
      <div class="sidebar__title">
        <img class="sidebar__logo" src="./src/assets/bloc-small.png" alt="logo app"></img>
        <h1 class="sidebar__text">Sticky Notes</h1>
      </div>
      <p class="sidebar__subtitle">Escríbelo antes de que lo olvides...</p>
    </header>

    <section class="sidebar__actions">
      <button type="button" class="btnAdd">
        <span class="material-symbols-outlined icon">add_circle</span>
        Nueva Nota</button>
      <div class="search">
        <!-- con la clase sr-only ocultaremos el label. Está aquí por accesibilidad -->
        <label class="sr-only" for="search">Buscar nota</label>
        <input id="search" type="search" name="search" class="search__input" placeholder="Buscar nota">
        <span class="material-symbols-outlined icon">search</span>
      </div>
    </section>

    <section class="sidebar__filters">
      <h3 class="filters-title">Filtrar por</h3>
      <ul class="filters-list">
        <li class="filter">
          <span class="material-symbols-outlined filter__icon">
            grid_view
          </span>
          <button class="filter__button" type="button">Todas</button>
          <span class="filter__count">12</span>
        </li>
        <li class="filter">
          <span class="material-symbols-outlined filter__icon">
            cottage
          </span>
          <button class="filter__button" type="button">Hogar</button>
          <span class="filter__count">5</span>
        </li>
        <li class="filter">
          <span class="material-symbols-outlined filter__icon">
            work
          </span>
          <button class="filter__button" type="button">Trabajo</button>
          <span class="filter__count">2</span>
        </li>
        <li class="filter">
          <span class="material-symbols-outlined filter__icon">
            emoji_objects
          </span>
          <button class="filter__button" type="button">Ideas</button>
          <span class="filter__count">2</span>
        </li>
        <li class="filter">
          <span class="material-symbols-outlined filter__icon">
            skull
          </span>
          <button class="filter__button" type="button">Te comió el tigre</button>
          <span class="filter__count">3</span>
        </li>
        <li class="filter">
          <span class="material-symbols-outlined filter__icon">
            label_off
          </span>
          <button class="filter__button" type="button"> Sin categoría</button>
          <span class="filter__count">3</span>
        </li>
      </ul>
    </section>

    <section class="sidebar__settings">

      <div class="themes">

        <button type="button" class="theme">
          <span class="material-symbols-outlined theme__icon theme__active-icon">
            wb_sunny
          </span>
          <span class="theme__text">Tema claro</span>
          <div class="theme__swich theme__active">
            <div class="theme__swich-button"></div>
          </div>
        </button>

        <button type="button" class="theme">
          <span class="material-symbols-outlined theme__icon">
            dark_mode
          </span>
          <span class="theme__text">Tema oscuro</span>
          <div class="theme__swich">
            <div class="theme__swich-button"></div>
          </div>
        </button>
      </div>

      <button type="button" class="trash">
        <span class="material-symbols-outlined trash__logo">
          delete
        </span>
        <span class="trash__text">Papelera</span>
      </button>

    </section>

  </aside>

  <main class="workspace">

    <!-- 
    Nota en la interfaz
    -->

    <template class="template__note">
      <article class="note">
        <header class="note__header">
          <h2 class="note__title">Título de la Nota</h2>

          <div class="note__buttons">
            <button type="button" class="note__edit" aria-label="cancelar">
              <span class="material-symbols-outlined btn-cancel">
                edit
              </span>
            </button>
            <button type="button" class="note__delete" aria-label="cancelar">
              <span class="material-symbols-outlined btn-cancel">
                cancel
              </span>
            </button>
          </div>
        </header>
        <section class="note__body">
          <p class="note__content">Lorem, ipsum dolor s
          </p>
        </section>
        <footer class="note__footer">
          <p>Categoría: <span class="note__category">Te comió el tigre</span></p>
        </footer>
      </article>
    </template>

  </main>

  <!-- 
    Modal para crear una nueva nota
    -->
  <dialog class="note__create">
    <header class="create__header">
      <h2 class="note__title">Nueva Nota</h2>
    </header>

    <form method="dialog" class="create__form">

      <label for="title">Categoría</label>
      <select name="category" id="category">
        <option value="no-category">Sin categoría</option>
        <option value="home">Hogar</option>
        <option value="work">Trabajo</option>
        <option value="idea">Ideas</option>
      </select>

      <label for="title">Título</label>
      <input type="text" name="title" id="title" class="note__input" placeholder="Título">

      <label for="content">Contenido</label>
      <textarea name="content" id="content" class="note__textarea" placeholder="Escribe aquí tu nota"></textarea>

      <div class="note__buttons-create">
        <button type="reset" class="note__cancel">Cancelar</button>
        <button type="submit" class="note__save">Guardar</button>
        <button type="submit" class="note__close" aria-label="cancelar">
          <span class="material-symbols-outlined btn-cancel">
            cancel
          </span>
        </button>
      </div>
    </form>
  </dialog>

  <!-- 
  Modal para editar una nota
-->

  <dialog class="modal__edit">
    <header class="edit__header">
      <h2 class="note__title">Editar Nota</h2>
    </header>

    <form method="dialog" class="edit__form">
      <label for="title">Categoría</label>
      <select name="category" id="category">
        <option value="no-category">Sin categoría</option>
        <option value="no-category">Hogar</option>
        <option value="no-category">Trabajo</option>
        <option value="no-category">Ideas</option>
      </select>
      <label for="title">Título</label>
      <input type="text" name="title" id="title" class="note__input" placeholder="Título">
      <label for="content">Contenido</label>
      <textarea name="content" id="content" class="note__textarea" placeholder="Escribe aquí tu nota"></textarea>
      <div class="note__buttons-edit">
        <button type="reset" class="note__cancel-edit">Cancelar</button>
        <button type="submit" class="note__save-edit">Guardar</button>
        <button type="submit" class="note__close-edit" aria-label="cancelar">
          <span class="material-symbols-outlined btn-cancel">
            cancel
          </span>
        </button>
      </div>
    </form>
  </dialog>

</body>

</html>

<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="./public/fav-list.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Livvic:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,900&display=swap"
    rel="stylesheet">
  <script type="module" defer src="/src/main.js"></script>
  <title>Lista de Tareas</title>
</head>

<body>
  <div class="container">

    <header class="header">
      <h1>Lista de Tareas</h1>
      <h2>Buenas noches, Pily</h2>
    </header>

    <form class="form">
      <input class="input" type="text" placeholder="Ingresa tu tarea" autofocus>
      <button type="submit" class="btn btn-add">
        <i class="fa-regular fa-square-plus"></i></button>
    </form>

    <main class=" container-tasks">

      <ul class="tasks">
        <div class="tasks-empty">
          <h3>No tienes tareas pendientes</h3>
        </div>
        <li class="task"></li>
      </ul>

      <section class="controls">
        <h2>Resultados</h2>

        <article class="card card-total">
          <h3>Total tareas</h3>
          <p>4</p>
        </article>

        <article class="card card-progress">
          <h3>Progreso actual</h3>
          <p>50%</p>
          <div class="progress-bar">
            <div class="progress"></div>
          </div>
        </article>

        <article class="card card-completed">
          <h3>Tareas Completadas</h3>
          <p>2</p>
          <div class="progress-bar">
            <div class="progress"></div>
          </div>
        </article>

        <article class="card card-pending">
          <h3>Tareas Pendientes</h3>
          <p>2</p>
          <div class="progress-bar">
            <div class="progress"></div>
          </div>
        </article>


      </section>
    </main>
  </div>

</body>

</html>

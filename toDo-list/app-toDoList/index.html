<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="./public/fav-list.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Livvic:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,900&display=swap"
    rel="stylesheet">
  <script type="module" defer src="/src/main.js"></script>
  <title>Lista de Tareas</title>
</head>

<body>
  <div class="container">
    <header class="header">
      <h1>Lista de Tareas</h1>
      <h2>Buenas noches, Pily</h2>
    </header>

    <section class="controls">
      <form class="form">
        <input class="input" type="text" placeholder="Ingresa tu tarea">
        <button type="submit" class="btn btn-add">
          <i class="fa-regular fa-square-plus""></i></button>
      </form>
    </section>

    <main class=" container-tasks">
            <ul class="taks">
              <li class="task">
                <label>
                  <input type="checkbox" class="checkbox">
                  <i class="fa-regular fa-circle"></i>
                  <i class="fa-solid fa-circle-check hidden"></i>
                  <span> Tarea desde HTML</span>
                </label>
                <div class="task-buttons">
                  <button class="btn btn-edit">
                    <i class="fa-solid fa-pen-to-square"></i>
                  </button>
                  <button class="btn btn-delete">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              </li>
              <li class="task">
                <label>
                  <input type="checkbox" class="checkbox">
                  <i class="fa-regular fa-circle"></i>
                  <i class="fa-solid fa-circle-check hidden"></i>
                  <span> Tarea desde HTML</span>
                </label>
                <div class="task-buttons">
                  <button class="btn btn-edit">
                    <i class="fa-solid fa-pen-to-square"></i>
                  </button>
                  <button class="btn btn-delete">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              </li>
            </ul>
            </main>

  </div>

</body>

</html>
